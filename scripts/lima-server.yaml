# A production quickddevpreviews host on macOS (e.g. a Mac mini): the run
# substrate (host Docker + ddev) is Linux-only, so the service runs inside this
# Ubuntu VM, the same substrate as a VPS. The VM is created once by the
# operator, then scripts/install.sh runs inside it exactly like on a fresh
# server:
#
#   brew install lima
#   limactl create --name=quickddevpreviews https://raw.githubusercontent.com/quickddevpreviews/quickddevpreviews/main/scripts/lima-server.yaml
#   limactl start quickddevpreviews
#   limactl shell quickddevpreviews
#   # inside the VM:
#   curl -fsSL https://raw.githubusercontent.com/quickddevpreviews/quickddevpreviews/main/scripts/install.sh | sudo bash
#
# After a macOS reboot: limactl start quickddevpreviews (the containers inside
# restart on their own).

vmType: "vz"
cpus: 4
memory: "8GiB"
disk: "80GiB"

# No mounts: a server needs nothing from the Mac's filesystem, and nothing on
# the Mac should be able to reach into the instance's state.

# Caddy's ports, exposed on ALL interfaces of the Mac so the router's port
# forwarding can reach them (Lima's default forwards bind to 127.0.0.1 only;
# macOS allows unprivileged binds below 1024). TCP only: Lima does not forward
# UDP, so HTTP/3 stays off and browsers fall back to HTTP/2.
#
# Guest port 3000 is the app itself (when running with COMPOSE_PROFILES
# unset, i.e. no Caddy): forwarded to the Mac's localhost only, for local
# access without opening the router.
portForwards:
- guestPort: 80
  hostIP: "0.0.0.0"
- guestPort: 443
  hostIP: "0.0.0.0"
- guestPort: 3000
  hostIP: "127.0.0.1"

minimumLimaVersion: 2.0.0

images:
- location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img"
  arch: "x86_64"
- location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"
